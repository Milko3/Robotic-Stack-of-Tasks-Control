services:
  sot:
    build:
      context: .
      dockerfile: Dockerfile
    image: sot-ros2:humble
    volumes:
      # GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Hela repot syns i containern som /sot
      - ..:/sot
    environment:
      - TERM=xterm-256color
      - DISPLAY=host.docker.internal:0.0
      - QT_X11_NO_MITSHM=1
    working_dir: /sot
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    ipc: host
